name: ML CI Pipeline

on:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker_lr

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t ml-devops-demo:latest .

      - name: Run container (smoke test)
        run: docker run -d --name ml-devops-demo -p 5000:5000 ml-devops-demo:latest

  run-docker-container:
    runs-on: ubuntu-latest
    needs: build-test
    defaults:
      run:
        working-directory: docker_lr

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image (job local)
        run: docker build -t ml-devops-demo:latest .

      - name: Run Docker container
        run: docker run -d --name ml-devops-demo -p 5000:5000 ml-devops-demo:latest

      - name: Verify container
        run: docker ps

  deploy-container:
    runs-on: ubuntu-latest
    needs: run-docker-container
    steps:
      - name: Deploy step
        run: echo "Deploy container job completed"

      - name: Show college name
        run: echo "College Name: NGIT"

  post-install-python:
    runs-on: ubuntu-latest
    needs: deploy-container
    steps:
      - name: Post install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Verify Python
        run: python --version
